# -p 8080:8080 -p 50000:50000 -v jenkins_box_data:/var/lib/docker \
#  --hostname=syscont --name=jenkins-box --restart=always \
#  nestybox/ubuntu-jammy-systemd-docker:latest

services:
  jenkins-box:
    # build:
    #   dockerfile: Dockerfile

    # use prebuild image  
    image: nestybox/ubuntu-noble-systemd-docker:latest

    # use own build image
    # image: ${REGISTRY_URL}/sysbox/ubuntu-systemd-docker:noble

    container_name: jenkins-box

    runtime: sysbox-runc

    # ports:
    #   - "20:22"
    #   - "8080:8080"
    #   - "50000:50000"
      
    hostname: syscont

    networks:
      - jenkins
      - devops

    restart: "always"

    volumes:
      - "jenkins_box_data:/var/lib/docker"


volumes:
  jenkins_box_data:

networks:
  jenkins:
    name: jenkins
    external: true
    
  devops:
    name: devops
    external: true